<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROFNSI — Espace professeur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--card:#f4f5f7;--bd:#d0d4da;--ac:#2563eb;--ok:#16794c;--warn:#b45309}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--fg:#e8e8e8;--card:#1d2026;--bd:#363b44;--ac:#6ea0ff;--ok:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font:inherit}
button.sec{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
input,select,textarea{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:7px;font:inherit;width:100%}
.wrap{max-width:1100px;margin:0 auto;padding:16px}.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:140px}.row>button{flex:none}
table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid var(--bd);text-align:left}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stats div{flex:1;min-width:110px;text-align:center;padding:8px;border:1px solid var(--bd);border-radius:8px}
.stats b{display:block;font-size:22px}pre{white-space:pre-wrap;background:var(--bg);padding:8px;border-radius:6px;font-size:13px}
.tag{padding:2px 8px;border-radius:10px;border:1px solid var(--bd);font-size:12px}.warn{color:var(--warn)}.ok{color:var(--ok)}
</style></head><body><div class="wrap" id="app"></div>
<script>
// ⚙️ À renseigner une seule fois (Supabase → Settings → API)
const SB_URL = "https://VOTRE-PROJET.supabase.co", SB_ANON = "VOTRE_CLE_ANON_PUBLIQUE";
const sb = supabase.createClient(SB_URL, SB_ANON);
const $ = id => document.getElementById(id), app = $("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const one = x => Array.isArray(x) ? x[0] : x;
let exams = [], cur = null, subs = [];

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  session ? home() : login();
}
function login(msg = "") {
  app.innerHTML = `<div class="card" style="max-width:360px;margin:10vh auto"><h2>PROFNSI — Professeur</h2>
  <p><input id="em" type="email" placeholder="E-mail"></p><p><input id="pw" type="password" placeholder="Mot de passe"></p>
  <button onclick="doLogin()">Connexion</button><p class="warn">${msg}</p></div>`;
}
async function doLogin() {
  const { error } = await sb.auth.signInWithPassword({ email: $("em").value, password: $("pw").value });
  error ? login("Identifiants incorrects") : home();
}
const code6 = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => "ABCDEFGHJKMNPQRSTUVWXYZ23456789"[b % 31]).join("");

async function home() {
  ({ data: exams } = await sb.from("exams").select("*").neq("status", "archive").order("created_at", { ascending: false }));
  const usageCard = (await settingsHtml()) + (await usageHtml());
  app.innerHTML = `<div class="row"><h2>Mes évaluations</h2><button class="sec" onclick="sb.auth.signOut().then(login)">Déconnexion</button></div>
  ${usageCard}<div class="card"><b>+ Nouvelle évaluation</b>
   <div class="row"><input id="t" placeholder="Titre"><select id="lv"><option value="premiere">Première NSI</option><option value="terminale">Terminale NSI</option></select>
   <input id="du" type="number" value="120" title="Durée (min)"></div>
   <p><textarea id="ins" rows="2" placeholder="Consignes"></textarea></p>
   <p><textarea id="exs" rows="5">[{"id":"ex1","title":"Exercice 1","points":10,"allowed":["python","texte"]},{"id":"ex2","title":"Exercice 2","points":10,"allowed":["texte","qcm"],"qcm_options":["A","B","C"]}]</textarea></p>
   <p><textarea id="st" rows="3" placeholder="Texte du sujet (obligatoire avec Mistral/Groq, facultatif avec Gemini ou Claude)"></textarea></p>
   <div class="row"><label>Sujet PDF<input id="f1" type="file" accept=".pdf"></label><label>Corrigé PDF (facultatif)<input id="f2" type="file" accept=".pdf"></label>
   <button onclick="createExam()">Créer + générer le code</button></div><div id="msg" class="warn"></div></div>
  <div class="card"><table><tr><th>Titre</th><th>Niveau</th><th>Code</th><th>Statut</th><th></th></tr>
  ${exams.map(e => `<tr><td>${esc(e.title)}</td><td>${e.level}</td><td><b>${e.access_code}</b></td><td><span class="tag">${e.status}</span></td>
   <td><button class="sec" onclick="openExam('${e.id}')">Copies</button>
   <button class="sec" onclick="setStatus('${e.id}','${e.status === "ouvert" ? "ferme" : "ouvert"}')">${e.status === "ouvert" ? "Fermer" : "Ouvrir"}</button>
   <button class="sec" onclick="dup('${e.id}')">Dupliquer</button> <button class="sec" onclick="setStatus('${e.id}','archive')">Archiver</button></td></tr>`).join("")}</table></div>`;
}
const PROVS = { gemini: "Gemini — gratuit, lit le PDF", mistral: "Mistral — gratuit, texte du sujet requis", groq: "Groq — gratuit, texte du sujet requis",
  openrouter: "OpenRouter — gratuit limité, texte requis", anthropic: "Claude — payant, lit le PDF" };
async function settingsHtml() {
  const [{ data: cfg }, r] = await Promise.all([sb.from("settings").select("*").eq("id", 1).maybeSingle(),
    sb.functions.invoke("correct", { body: { action: "providers" } })]);
  const ok = r.data?.providers || {}, cur = cfg?.provider || "gemini";
  return `<div class="card"><b>Fournisseur IA de correction</b><div class="row"><select id="prov">${Object.entries(PROVS).map(([k, v]) =>
    `<option value="${k}" ${k === cur ? "selected" : ""}>${v} ${ok[k] ? "✓ clé prête" : "⚠ clé absente"}</option>`).join("")}</select>
    <input id="mdl" placeholder="Modèle (vide = par défaut)" value="${esc(cfg?.model)}"><button onclick="saveProv()">Enregistrer</button></div>
    <small>Les clés restent sur le serveur (secrets Supabase), jamais dans le navigateur.</small></div>`;
}
async function saveProv() {
  const { error } = await sb.from("settings").upsert({ id: 1, provider: $("prov").value, model: $("mdl").value.trim() || null });
  alert(error ? "Erreur : " + error.message : "✓ Fournisseur enregistré");
}
async function dup(id) {
  const { id: _i, created_at, ...rest } = exams.find(x => x.id === id);
  await sb.from("exams").insert({ ...rest, title: rest.title + " (copie)", access_code: code6(), status: "brouillon" }); home();
}
async function usageHtml() {
  const { data } = await sb.from("ai_usage").select("model,tokens_in,tokens_out,at").gte("at", new Date(Date.now() - 30 * 864e5).toISOString());
  if (!data) return "";
  const day = new Date().toDateString(), today = data.filter(u => new Date(u.at).toDateString() === day).length, by = {};
  data.forEach(u => { const m = by[u.model] ??= { n: 0, i: 0, o: 0 }; m.n++; m.i += u.tokens_in || 0; m.o += u.tokens_out || 0; });
  return `<div class="card"><b>Consommation IA (30 jours)</b> — ${today} correction(s) aujourd'hui<br>` +
    (Object.entries(by).map(([k, m]) => `${esc(k)} : ${m.n} appels, ${m.i.toLocaleString("fr-FR")} jetons entrants, ${m.o.toLocaleString("fr-FR")} sortants`).join("<br>") || "Aucun appel pour l'instant") +
    `<br><small>Les limites gratuites dépendent du fournisseur : consultez sa console (Google AI Studio, Mistral…).</small></div>`;
}
async function up(file) {
  if (!file) return null; const p = crypto.randomUUID() + "/" + file.name.replace(/[^\w.-]/g, "_");
  const { error } = await sb.storage.from("subjects").upload(p, file); if (error) throw error; return p;
}
async function createExam() {
  try {
    const exercises = JSON.parse($("exs").value), total = exercises.reduce((s, x) => s + Number(x.points || 0), 0);
    if (!$("t").value) throw new Error("Titre requis");
    const { error } = await sb.from("exams").insert({ title: $("t").value, level: $("lv").value, duration_min: +$("du").value,
      instructions: $("ins").value, subject_text: $("st").value || null, exercises, total_points: total, access_code: code6(),
      subject_path: await up($("f1").files[0]), solution_path: await up($("f2").files[0]) });
    if (error) throw error; home();
  } catch (e) { $("msg").textContent = "Erreur : " + e.message; }
}
async function setStatus(id, status) { await sb.from("exams").update({ status }).eq("id", id); home(); }

async function openExam(id) {
  cur = exams.find(e => e.id === id);
  ({ data: subs } = await sb.from("submissions").select("*, corrections(*)").eq("exam_id", id).order("last_name"));
  const notes = subs.map(s => one(s.corrections)).filter(Boolean).map(c => +c.total);
  const st = n => n.length ? n : null, m = notes.length ? (notes.reduce((a, b) => a + b, 0) / notes.length).toFixed(2) : "–";
  app.innerHTML = `<div class="row"><h2>${esc(cur.title)} — code ${cur.access_code}</h2><button class="sec" onclick="home()">← Retour</button></div>
  <div class="stats"><div><b>${subs.length}</b>commencées</div><div><b>${subs.filter(s => s.locked).length}</b>rendues</div>
  <div><b>${m}</b>moyenne</div><div><b>${notes.length ? Math.max(...notes) : "–"}</b>max</div><div><b>${notes.length ? Math.min(...notes) : "–"}</b>min</div></div><br>
  <div class="card"><div class="row"><button onclick="correctAll()">Corriger toutes les copies rendues</button><button class="sec" onclick="exportCsv()">Exporter CSV</button><span id="prog"></span></div><br>
  <table><tr><th>Élève</th><th>Classe</th><th>Statut</th><th>Note</th><th></th></tr>
  ${subs.map(s => { const c = one(s.corrections); return `<tr><td>${esc(s.last_name)} ${esc(s.first_name)}</td><td>${esc(s.class_name)}</td>
   <td><span class="tag">${s.status}</span> ${c?.to_review ? '<span class="warn">à vérifier</span>' : ""}</td><td>${c ? c.total + "/20" : "–"}</td>
   <td><button class="sec" onclick="detail('${s.id}')">Consulter</button></td></tr>`; }).join("")}</table></div><div id="det"></div>`;
}
async function correct(id) {
  const { data, error } = await sb.functions.invoke("correct", { body: { submission_id: id } });
  return error || data?.error ? (error?.message || data.error) : null;
}
async function correctAll() {
  const todo = subs.filter(s => s.locked && !one(s.corrections)); let i = 0, fails = [];
  for (const s of todo) { $("prog").textContent = `Correction ${++i}/${todo.length}…`; const e = await correct(s.id); if (e) fails.push(s.last_name + " : " + e); }
  alert(fails.length ? "Échecs (relancez) :\n" + fails.join("\n") : "Correction terminée"); openExam(cur.id);
}
async function detail(id) {
  const s = subs.find(x => x.id === id), c = one(s.corrections);
  const { data: evs } = await sb.from("events").select("*").eq("submission_id", id).order("at");
  $("det").innerHTML = `<div class="card"><h3>${esc(s.last_name)} ${esc(s.first_name)} — ${esc(s.class_name)}</h3>
  <p><button onclick="doCorrect('${id}')">${c ? "Relancer la correction IA" : "Corriger avec l'IA"}</button></p>
  ${c ? `<p>Note finale /20 : <input id="nt" type="number" step="0.25" min="0" max="20" value="${c.total}" style="width:100px">
   <button onclick="validate('${id}')">Valider la note</button> <span class="${c.status === "validee" ? "ok" : "warn"}">${c.status}</span></p>
   <p><button class="sec" onclick="sendRes('${id}','download')">Télécharger le PDF</button>
   <button class="sec" onclick="sendRes('${id}','email')">${c.emailed_at ? "Renvoyer par e-mail" : "Envoyer par e-mail"}</button>
   ${c.emailed_at ? `<span class="ok">✓ envoyé le ${new Date(c.emailed_at).toLocaleString("fr-FR")}</span>` : ""}
   ${c.email_error ? `<span class="warn">⚠ dernier envoi en échec</span>` : ""}</p>
   ${(c.result.exercices || []).map(x => `<p><b>${esc(x.id)} : ${x.points_obtenus}/${x.points_max}</b> ${x.a_verifier ? '<span class="warn">⚠ à vérifier</span>' : ""}<br>${esc(x.justification)}</p>`).join("")}` : ""}
  <h4>Réponses</h4><pre>${esc(JSON.stringify(s.answers, null, 2))}</pre>
  <h4>Journal (indicatif, pas une preuve)</h4><pre>${(evs || []).map(e => new Date(e.at).toLocaleTimeString() + "  " + e.type).join("\n") || "Aucun événement"}</pre></div>`;
  $("det").scrollIntoView();
}
async function doCorrect(id) { const e = await correct(id); if (e) alert(e); openExam(cur.id).then(() => detail(id)); }
async function validate(id) {
  await sb.from("corrections").update({ total: +$("nt").value, status: "validee", validated_at: new Date().toISOString() }).eq("submission_id", id);
  await sb.from("submissions").update({ status: "validee" }).eq("id", id);
  await sendRes(id, "email");  // envoi automatique après validation
  openExam(cur.id).then(() => detail(id));
}
async function sendRes(id, mode) {
  const { data, error } = await sb.functions.invoke("send-result", { body: { submission_id: id, mode } });
  if (error || data?.error) return alert("⚠ " + (mode === "email" ? "Échec de l'envoi e-mail (réessayez avec « Renvoyer »)" : "Échec du PDF") + "\n" + (data?.detail || data?.error || error.message));
  if (mode === "email") return alert("✓ Copie envoyée à profnsi27@gmail.com");
  const a = document.createElement("a"); a.download = data.filename;
  a.href = URL.createObjectURL(await (await fetch("data:application/pdf;base64," + data.pdf)).blob()); a.click();
}
function exportCsv() {
  const rows = [["Nom", "Prénom", "Classe", "Statut", "Note/20"], ...subs.map(s => [s.last_name, s.first_name, s.class_name, s.status, one(s.corrections)?.total ?? ""])];
  const a = document.createElement("a"); a.download = cur.title + ".csv";
  a.href = URL.createObjectURL(new Blob(["\ufeff" + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";")).join("\n")]));
  a.click();
}
init();
</script></body></html>
